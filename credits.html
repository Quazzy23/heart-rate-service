<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Author & Credits</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1a1a1e !important;
            font-family: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .author-card {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 32px 36px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 280px;
        }

        .author-avatar {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .author-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .author-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: 0px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="author-card">
        <div class="author-title">Project author</div>
        <div class="author-name">Quazzy</div>

        <div class="social-links">
            <a href="https://github.com/Quazzy23" target="_blank" class="social-btn">GitHub: @Quazzy23</a>
            <a href="https://www.youtube.com/@Quazzy23" target="_blank" class="social-btn">YouTube: @Quazzy23</a>
            <a href="https://www.instagram.com/quazzy_23" target="_blank" class="social-btn">Instagram: @quazzy_23</a>
        </div>
    </div>

</body>
</html>
