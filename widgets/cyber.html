<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Heart Rate Overlay</title>
    <style>
        /* 1. Полностью прозрачный фон, центрирование по экрану */
        html, body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            background-color: rgba(0, 0, 0, 0) !important;
            font-family: 'Rajdhani', 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* 2. Неоновая рамка-рубка в стиле Cyberpunk */
        .cyber-card {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: rgba(10, 10, 15, 0.85);
            
            width: 340px;
            height: 130px;
            padding-left: 30px;
            
            border-radius: 12px; /* Угловатый киберпанк-стиль */
            border: 2px solid #00f3ff; /* Неоново-голубая рамка */
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            transition: all 0.4s ease;
        }

        .heart-icon {
            font-size: 70px;
            margin-right: 20px;
            display: inline-block;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.8));
            animation: cyber-beat 0.75s infinite ease-in-out;
        }

        .bpm-container {
            display: flex;
            align-items: flex-end;
            line-height: 1;
        }

        .bpm-value {
            font-size: 90px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 0.9;
            color: #ffffff;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .bpm-unit {
            font-size: 24px;
            font-weight: 700;
            margin-left: 12px;
            margin-bottom: 6px;
            text-transform: lowercase;
            line-height: 1;
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        /* Неоновые цветовые зоны */
        .cyber-white { 
            color: #ffffff !important; 
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }
        .cyber-yellow { 
            color: #ffe600 !important; 
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8); 
        }
        .cyber-red { 
            color: #ff0055 !important; 
            text-shadow: 0 0 18px rgba(255, 0, 85, 0.9); 
        }

        /* Резкий кибер-удар сердца */
        @keyframes cyber-beat {
            0% { transform: scale(1); }
            12% { transform: scale(1.3); }
            25% { transform: scale(1); }
            37% { transform: scale(1.18); }
            50% { transform: scale(1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="cyber-card" id="card">
        <div class="heart-icon">❤️</div>
        
        <div class="bpm-container">
            <span id="bpm" class="bpm-value cyber-white">--</span>
            <span class="bpm-unit">bpm</span>
        </div>
    </div>

    <script>
        const bpmEl = document.getElementById('bpm');
        const cardEl = document.getElementById('card');

        function updateWidget(bpm) {
            bpmEl.textContent = bpm;
            bpmEl.className = 'bpm-value';

            if (bpm < 80) {
                bpmEl.classList.add('cyber-white');
                cardEl.style.borderColor = '#00f3ff'; // Голубой неон
                cardEl.style.boxShadow = '0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2)';
            } else if (bpm >= 80 && bpm < 120) {
                bpmEl.classList.add('cyber-yellow');
                cardEl.style.borderColor = '#ffe600'; // Желтый неон
                cardEl.style.boxShadow = '0 0 20px rgba(255, 230, 0, 0.4), inset 0 0 15px rgba(255, 230, 0, 0.2)';
            } else if (bpm >= 120) {
                bpmEl.classList.add('cyber-red');
                cardEl.style.borderColor = '#ff0055'; // Малиновый неон
                cardEl.style.boxShadow = '0 0 25px rgba(255, 0, 85, 0.6), inset 0 0 20px rgba(255, 0, 85, 0.3)';
            }
        }

        function connect() {
            const socket = new WebSocket('ws://localhost:8765');

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.bpm) {
                    updateWidget(data.bpm);
                }
            };

            socket.onclose = () => {
                bpmEl.textContent = '--';
                bpmEl.className = 'bpm-value cyber-white';
                setTimeout(connect, 2000);
            };

            socket.onerror = () => {
                socket.close();
            };
        }

        connect();
    </script>
</body>
</html>
